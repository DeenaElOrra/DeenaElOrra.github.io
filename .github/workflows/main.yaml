name: ci
on:
  - push
  - pull_request
  
# Environment
env:
  CI: true
  PYTHON_VERSION: 3.12

# Jobs to run
jobs:
     
  # Build and deploy documentation site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:

      # Checkout source form GitHub
      - uses: actions/checkout@v4

      # Install Python runtime and dependencies
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pip
      - run: |
          pip install -r requirements.txt

      # regenerate the figures and numbers of the Data exercise
      - run: |
          python docs/exercises/data/code/data.py > /dev/null

      # commit the generated figures and results back to the repository
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/exercises/data/figures docs/exercises/data/code/results.json
          git diff --cached --quiet || (git commit -m "Data exercise: commit generated figures and results.json" && git push)
          
      # deploy
      - run: |
          mkdocs gh-deploy --force
