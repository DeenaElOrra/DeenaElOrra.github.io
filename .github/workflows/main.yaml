name: ci
on:
  - push
  - pull_request
  
# Environment
env:
  CI: true
  PYTHON_VERSION: 3.12

# Jobs to run
jobs:
     
  # Build and deploy documentation site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:

      # Checkout source form GitHub
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Python runtime and dependencies
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pip
      - run: |
          pip install -r requirements.txt

      # regenerate the figures and numbers of the Data and MLP exercises
      - run: |
          python docs/exercises/data/code/data.py > /dev/null
          python docs/exercises/mlp/code/mlp.py > /dev/null

      # commit generated figures and results.json when they are missing or the script changed
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ex in data mlp; do
            d=docs/exercises/$ex
            if [ -z "$(git ls-files $d/figures)" ] || ! git diff --quiet ${{ github.event.before }} HEAD -- $d/code/*.py 2>/dev/null; then
              git add $d/figures $d/code/results.json
            fi
          done
          git diff --cached --quiet || (git commit -m "Commit generated figures and results.json" && git pull --rebase --autostash origin main && git push)
          
      # deploy
      - run: |
          mkdocs gh-deploy --force
